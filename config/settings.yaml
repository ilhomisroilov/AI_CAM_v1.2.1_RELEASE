# AI_CAM v1.2.1 — CANONICAL configuration (single source of truth).
# This one file holds every deployment setting: hardware IP/ports, server/admin
# login, GPU/CPU mode, model paths and runtime tuning. Copy the project to any
# folder and run `python run.py` — no /etc, no systemd required.
#
# Secrets (${AI_CAM_*}) are auto-loaded at startup from deploy/local/ai-cam.env
# (git-ignored) if present, or from real environment variables. Both are OPTIONAL
# overrides — their absence prints a warning and never stops startup.
camera:
  ip: 10.123.86.42
  cola_port: 2111
  blob_port: 2113
  blob_autodetect: false
  # Auto-loaded from deploy/local/ai-cam.env (or env override) at startup.
  password: ${AI_CAM_CAMERA_PASSWORD}
  recv_timeout: 3.0
  reconnect_delay: 2.0
  trigger_pulse_off_delay: 0.15
  capture_timeout: 5.0
  stale_after_sec: 3
  max_consecutive_timeouts: 5
  reconnect_initial_delay_sec: 1
  reconnect_max_delay_sec: 30
  reconnect_max_attempts: 0

plc:
  enabled: true
  mode: melsec
  ip: 10.123.40.99
  port: 5003
  plc_type: Q
  signal_address: D2222
  trigger_on_value: 1
  signal_kind: bit
  signal_bit: 0
  trigger_mask: 0
  trigger_mode: pulse
  trigger_kind:
  trigger_bit: 0
  camera_delay_sec: 0
  camera_search_timeout_sec: 30
  done_address: ''
  done_value: 1
  done_clear_value: 0
  write_enabled: true
  require_acknowledgement: false
  ack_timeout_ms: 5000
  startup_recovery_policy: wait_for_edge
  exit_address: ''
  exit_on_value: 1
  require_zero_before_rearm: true
  poll_interval_ms: 100
  reconnect_max_delay_sec: 30
  # v1.3.0 D2222 forensic debounce + pulse-width audit (runtime/audit/plc_edges_*).
  # 200ms stable-high required before a cycle starts (filters short noise pulses);
  # falling-edge width outside [min,max] is audited as INVALID_PLC_PULSE.
  plc_edge_audit_enabled: true
  debounce_on_ms: 200
  debounce_off_ms: 200
  expected_pulse_min_ms: 2000
  expected_pulse_max_ms: 4500
  full_stop_on_zero: true
  auto_off_on_vin: true
  off_delay_sec: 0

rfid:
  enabled: true
  mode: r700
  ip_address: 10.123.18.3
  port: 80
  timeout: 5
  stale_event_tolerance_ms: 1500
  read_duration_ms: 700
  inventory_duration_ms: 6000
  inventory_retry_duration_ms: 4000
  inventory_retry_after_ms: 2000
  warmup_ms: 150
  username: ${AI_CAM_RFID_USERNAME}
  password: ${AI_CAM_RFID_PASSWORD}
  antenna_ports: [1, 2, 3, 4]
  tx_power_cdbm: 3150
  epc_decimal_validate: true
  epc_decimal_min: 1000
  epc_decimal_max: 9999
  reconnect_max_delay_sec: 30
  sim_epc: ''

session:
  timeout_sec: 30
  hold_until_deadline: true
  require_rfid: true
  rfid_grace_sec: 15
  ocr_inflight_grace_sec: 15
  max_pending_triggers: 10
  overflow_policy: reject_with_alarm
  # v1.3.0 body-cycle invariant (1 body = 1 cycle = 1 DB record).
  # Production: real bodies are >= 90s apart, so a trigger during an active cycle
  # (or sooner than minimum_body_interval_sec) is a duplicate/bounce/external
  # pulse -> ignored + audited, NOT queued. Set pending_trigger_queue_enabled=true
  # ONLY for the simulator/test bench.
  pending_trigger_queue_enabled: false
  minimum_body_interval_sec: 90
  same_vin_dedup_sec: 180
  max_capture_delay_ms: 4000
  exit_signal_enabled: false
  post_exit_grace_ms: 2500
  max_session_duration_sec: 30

detection:
  model_path: models/yolo/best.pt
  conf_threshold: 0.4
  ocr_trigger_conf: 0.85
  iou_threshold: 0.45
  device: cuda:0
  crop_padding: 8
  ocr_rearm_absent_frames: 3
  ocr_cooldown_sec: 2
  ocr_session_max_triggers: 12
  ocr_confirm_frames: 2
  ocr_submit_on_exit: true
  ocr_crop_margin_frac: 0.15
  min_crop_quality: 0.45
  event_buffer_max: 10
  fusion_k: 4
  collect_enabled: false
  collect_conf: 0.4
  collect_min_interval_sec: 1
  collect_class_id: 0

ocr:
  lang: en
  use_gpu: true
  apply_clahe: true
  clahe_clip: 3.0
  clahe_grid: 8
  upscale_height: 96
  sharpen: true
  paddle_det: true
  det_fallback_enabled: false
  use_angle_cls: false
  drop_score: 0.3
  rec_batch_num: 6
  det_limit_side_len: 960
  min_char_confidence: 0.3
  min_confidence: 0.45
  bilateral: true
  bilateral_d: 5
  bilateral_sigma: 50
  duplicate_window_sec: 90
  parallel_engines: 1
  enable_mkldnn: false
  cpu_threads: 1
  worker_task_timeout_sec: 12
  worker_start_timeout_sec: 60
  worker_max_restarts: 50
  queue_maxsize: 50
  variants_enabled: [raw_resized, clahe_unsharp, blackhat_relief]
  variant_rotations: [0, -3, 3]
  variant_deskew: true
  retry_enabled: true
  retry_rotations: [-7, 7]
  max_ocr_attempts: 16

vin:
  enabled: true
  default_model: QY
  min_final_score: 0.55
  accept_final_score: 0.8
  accept_min_crops: 2
  accept_multi_variant_min: 3
  accept_risky_margin: 0.2
  accept_raw_support_ratio: 0.5
  accept_single_read: false
  accept_single_min_score: 0.8
  pos5_min_crops: 2
  pos5_min_variants: 3
  pos5_min_margin: 0.2
  pos5_reject_structure_only: true
  pos5_structure_rescue_enabled: true
  pos5_structure_rescue_raw_chars: '38'
  pos5_structure_rescue_min_score: 0.9
  pos5_structure_rescue_min_raw_support: 0.85
  accept_variable_margin: 0.08
  accept_serial_margin: 0.12
  exact_conflict_ratio: 0.55
  exact_rescue_min_conf: 0.74
  independent_crop_hash_distance: 5
  struct_bonus_variable: 0.15
  require_known_model: true
  enforce_fixed_positions: true

ocr_engines:
  primary_engine: paddleocr_legacy
  shadow_engine: ''
  fallback_engine: ''
  validation_profile: current_production
  charset_profile: alphanumeric_36
  engraved_model_path: ''

ocr_release:
  # GUARDED_PRIMARY: ENGRAVED_V121 is the primary VIN candidate; Paddle RAW +
  # Enhanced act as independent validators/fallback. All guards (confidence,
  # supported charset, 17-char, segmentation, weak-class, disagreement) apply —
  # unseen/weak characters are never invented (returned as UNKNOWN_CHAR).
  # HOTFIX RC1 (2026-07-30) — ATAYLAB `SHADOW` ga QAYTARILDI.
  # Sabab: ENGRAVED_V121 charset = "0123456789ABCDEFHJNST" (21 belgi) va u
  # G, U, V, W belgilarini UMUMAN ifodalay olmaydi. pos10 yil kodlari
  # {T,U,V,W} bo'lgani uchun bu model 4 tadan 3 tasini hech qachon
  # to'g'ri o'qiy olmaydi. Ishlab chiqarish dalili: 95/95 sessiyada
  # status=EMPTY. `GUARDED_PRIMARY` bugun faqat ikki hujjatlanmagan
  # himoya tufayli zarar keltirmayapti (`write_final=False` va
  # `record_legacy_shadow_final` ning qat'iy qiymatlari). Bu qiymatni
  # bevosita `SHADOW` ga qadab qo'yamiz — himoyalarga tayanmaymiz.
  # Tekshiruv: tests/test_engraved_shadow_only_hotfix_guard.py
  release_mode: SHADOW
  engraved_enabled: true
  engraved_model_dir: models/engraved_ocr_v1.2.1
  engraved_expected_length: 17
  paddle_raw_enabled: true
  paddle_enhanced_enabled: true
  engine_timeout_ms: 4000
  store_raw_results: true
  collection_enabled: true
  collection_root: runtime/engraved_ocr_collection
  collection_target_chars: V,G,A,D,H,B,5,6,7,0,2,3
  weak_classes: 5,6,7,A,B,D,H
  weak_classes_enabled: false

pos5_verifier:
  enabled: false
  model_path: ''
  backend: hog_svm
  min_confidence: 0.6
  save_char_crops: false

vin_slot_recognizer:
  enabled: false
  mode: shadow
  model_path: models/vin_slot_recognizer_pilot/best.pt
  device: auto
  accept_on_paddle_fail: false
  min_avg_confidence: 0.8
  min_char_confidence: 0.35
  require_paddle_support: true
  min_paddle_exact_reads: 1
  agree_bonus: 0.03
  reject_on_disagree: false

server:
  host: 0.0.0.0
  port: 8080
  mjpeg_fps: 25
  jpeg_quality: 80

auth:
  enabled: true
  # LAN default web login is admin/admin (never blocks startup — warning only).
  # For a stronger password set AI_CAM_ADMIN_PASSWORD in the environment.
  username: admin
  password: admin
  operator_username: ''
  operator_password: ''
  session_ttl_sec: 7200
  max_failed_attempts: 5
  lockout_seconds: 300
  cookie_secure: false
  csrf_enabled: true

operations:
  timezone: Asia/Tashkent
  disk_warning_free_gb: 10
  disk_critical_free_gb: 2
  crop_retention_max: 5000
  collector_retention_days: 0
  backup_retention_days: 30
  max_expected_child_processes: 8
  health_preflight_timeout_sec: 1
  file_logging_enabled: true
